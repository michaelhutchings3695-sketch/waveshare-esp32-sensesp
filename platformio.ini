[platformio]
default_envs = waveshare_esp32s3poe

[env:waveshare_esp32s3poe]
platform = espressif32 @ ^6.7.0
board = esp32s3box
framework = arduino

; Build and upload settings
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esp-prog

; Memory configuration
board_upload.flash_size = 16MB
board_upload.flash_mode = qio
board_upload.flash_freq = 80m
board_build.partitions = huge_app.csv

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DPSRAM_MODE=4
    -mfix-esp32-psram-cache-issue

; Libraries
lib_deps =
    SignalK/SensESP @ ^3.0.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/PCF8574 Arduino Library @ ^1.4.2
    madhephaestus/ESP32Servo @ ^1.0.2
    fastled/FastLED @ ^3.6.0
    etl @ ^20.38.14

; OTA updates
ota_ip_address = 192.168.1.100
ota_port = 3232
ota_password = changeme

; Advanced settings
lib_ldf_mode = deep+
build_type = release
